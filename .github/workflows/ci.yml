
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Проверка кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: flake8 src tests

  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v --junitxml=report.xml

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: report.xml

  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: |
          pip install build
          python -m build

      - run: |
          pip install dist/*.whl
          calc add 2 3

      - name: Сохранить сборку
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
